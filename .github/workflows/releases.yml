name: Release snapshot
# Keeps assets/releases.json — the download page's fallback — current.
# The app's release workflow dispatches `release-published` after it
# uploads a release; the schedule catches anything that did not.
on:
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: release-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh the snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/releases-snapshot.mjs
      - name: Write the package-manager manifests
        run: node scripts/packaging.mjs
      - name: Rebuild and verify the review download snapshot
        run: |
          npm run build
          npm test
      - name: Commit what changed
        id: snapshot
        env:
          SNAPSHOT_TAG: ${{ github.event.client_payload.tag || '' }}
        run: |
          git add assets/releases.json packaging review sitemap.xml
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "releases: snapshot $SNAPSHOT_TAG"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the refreshed static pages
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Workflow-token pushes do not themselves trigger a Pages build.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Push the cask to the tap
        # cbassuarez/homebrew-tap carries Casks/nus.rb. TAP_TOKEN needs
        # Contents: write there; without it the cask is only kept here.
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_TOKEN not set; cask left in packaging/"; exit 0; fi
          if [ ! -f packaging/homebrew/Casks/nus.rb ]; then echo "no cask yet"; exit 0; fi
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/cbassuarez/homebrew-tap" tap
          mkdir -p tap/Casks && cp packaging/homebrew/Casks/nus.rb tap/Casks/nus.rb
          cd tap
          git add -A && if git diff --cached --quiet; then echo "tap is current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "nus $(grep -m1 "^  version" Casks/nus.rb | cut -d'"' -f2)"
          git push -q
