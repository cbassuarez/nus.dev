name: Build Feel integration
on:
  push:
    branches: [feel-cuelume-20260920]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feel-cuelume-20260920
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Vendor pinned Cuelume
        run: node scripts/vendor-cuelume.mjs 0.2.2
      - name: Build complete static site
        run: npm run build
      - name: Run tests against vendored package
        run: npm test
      - name: Commit generated assets and pages
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor assets/js assets/css review index.html about download docs panels 404.html sitemap.xml robots.txt scripts/checks tests docs package.json README.md || true
          git add -u
          git commit -m "Generate the Feel integration and vendored Cuelume 0.2.2"
          git push origin HEAD:feel-cuelume-20260920
