name: Generate mobile audio fix
on:
  push:
    branches: [fix-ios-media-cuelume-20260920]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-ios-media-cuelume-20260920
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      - name: Commit generated pages
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about download docs panels review 404.html sitemap.xml robots.txt
          git commit -m "Regenerate pages for resilient iOS Cuelume transport"
          git push origin HEAD:fix-ios-media-cuelume-20260920
