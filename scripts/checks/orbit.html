<!doctype html>
<meta charset="utf-8">
<title>orbit check</title>
<!-- One position per load: open with a hash, e.g. #0.5, to inspect the sweep
     at that fraction of the orbit's pin without needing a mouse. -->
<style>
  html,body { margin:0; height:100%; background:#bbb; }
  iframe { width:100%; height:100%; border:0; display:block; }
</style>
<iframe id="f" src="/"></iframe>
<script>
const p = parseFloat(location.hash.slice(1)) || 0;
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  const rail = d.querySelector('[data-orbit-rail]');
  const stage = d.querySelector('[data-orbit-stage]');
  if (!rail || !stage) { document.title = 'orbit check · no orbit'; return; }
  const travel = rail.offsetHeight - stage.offsetHeight;
  w.scrollTo(0, rail.offsetTop + travel * p);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.title = 'orbit check · p=' + p;
  }));
});
</script>
