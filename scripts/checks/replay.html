<!doctype html>
<meta charset="utf-8">
<title>replay check</title>
<!--
  Drives the hero terminal to fixed points in the recording and paints each
  one, so the replay can be checked without waiting on wall-clock time.
  Open at /scripts/checks/replay.html with `npm run dev`.
-->
<link rel="stylesheet" href="../../assets/css/site.css">
<style>
  body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 18px 0 6px; }
  .frame { width: 720px; height: 380px; border: 2px solid var(--ink); }
  .frame > div { width: 100%; height: 100%; }
  canvas { display: block; }
</style>

<div id="out"></div>

<script type="module">
import { mountHeroTerminal } from '../../assets/js/terminal.js';

const TIMES = [1.2, 3.0, 4.6, 6.8];
const out = document.getElementById('out');

for (const t of TIMES) {
  const h = document.createElement('h2');
  h.textContent = `t = ${t}s`;
  out.appendChild(h);

  const root = document.createElement('div');
  root.className = 'frame';
  root.dataset.heroTerm = '';
  root.innerHTML = '<div><canvas></canvas></div>';
  out.appendChild(root);

  const term = await mountHeroTerminal(root, {
    wasm: '../../assets/wasm/nus_vt_wasm_bg.wasm',
    cast: '../../casts/nus-vt.cast'
  });
  term.pause(true);
  term.seek(t);

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11px;color:var(--dim);padding:4px 0 10px';
  note.textContent =
    `${term.cast.cols}×${term.cast.rows} · cursor ${term.vt.cursor_row},${term.vt.cursor_col}` +
    ` · at_prompt=${term.vt.at_prompt} · title=${JSON.stringify(term.vt.title)}`;
  out.appendChild(note);
}

document.title = 'replay check · ready';
</script>
