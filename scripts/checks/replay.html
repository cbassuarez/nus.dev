<!doctype html>
<meta charset="utf-8">
<title>replay check</title>
<!-- One frame per load: open with #<seconds> to park the replay there.
     The shell is drawn by nus_render::GridRenderer, so this is also the
     check that the draw list is being consumed correctly. -->
<link rel="stylesheet" href="../../assets/css/site.css">
<style>
  body { margin:0; padding:16px; background: var(--paper); color: var(--ink); }
  .frame { width: 760px; height: 400px; border: 2px solid var(--ink); }
  .frame > div { width:100%; height:100%; }
  canvas { display:block; }
  #note { font-size:11px; color:var(--dim); padding-top:8px; }
</style>
<div class="frame" id="root" data-hero-term><div><canvas></canvas></div></div>
<div id="note">loading…</div>
<script type="module">
import { mountHeroTerminal } from '../../assets/js/terminal.js';

const t = parseFloat(location.hash.slice(1));
const root = document.getElementById('root');

const term = await mountHeroTerminal(root, {
  wasm: '../../assets/wasm/nus_vt_wasm_bg.wasm',
  cast: '../../casts/nus-vt.cast'
});
term.userPaused = true;
term.pause(true);
term.seek(Number.isFinite(t) ? t : term.duration);

document.getElementById('note').textContent =
  `${term.cast.cols}×${term.cast.rows} · cell ${term.shell.cell_w.toFixed(2)}×` +
  `${term.shell.cell_h.toFixed(2)} @ ${term.px.toFixed(2)}px · ` +
  `at_prompt=${term.shell.at_prompt} · atlas ${term.atlas.height}px tall · ` +
  `${term.shell.instances_len / term.shell.stride} instances`;
document.title = 'replay check · ready';
</script>
